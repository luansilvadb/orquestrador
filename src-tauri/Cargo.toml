[package]
name = "orquestrador"
version = "0.1.0"
edition = "2021"

[lib]
name = "orquestrador_lib"
path = "src/lib.rs"

[[bin]]
name = "orquestrador"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects"] }
tauri-plugin-updater = "2"
semver = "1"
