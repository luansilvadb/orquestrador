[package]
name = "orquestrador"
version = "0.1.5"
edition = "2021"
default-run = "orquestrador"

[lib]
name = "orquestrador_lib"
path = "src/lib.rs"

[[bin]]
name = "orquestrador"
path = "src/main.rs"

# Programa de console (sem `windows_subsystem`): o PowerShell espera por ele e recebe o código de saída.
[[bin]]
name = "orquestrador-delegar"
path = "src/bin/orquestrador-delegar.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_DataExchange", "Win32_UI_Shell"] }
tauri-plugin-updater = "2"
