[package]
name = "orquestrador"
version = "0.1.23"
edition = "2021"

[lib]
name = "orquestrador_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Motor da pesquisa e da substituição (já estava na árvore via tauri/outras crates; declarado aqui para uso direto).
regex = "1"
tauri-plugin-updater = "2"
ignore = "0.4.33"

# As chamadas ao Windows ficam em `src/platform/windows.rs`; fora do Windows, esta dependência nem entra.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }
