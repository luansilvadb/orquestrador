# Gera o instalador NSIS assinado e o latest.json para uma tag vX.Y.Z. A release nasce como rascunho:
# os apps só a enxergam quando alguém a publica, e a verificação do fim do job precisa ter passado.
name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Conferir que a tag é a versão do app
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "A tag $($env:TAG) não é vX.Y.Z." }
          $version = $env:TAG.Substring(1)
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($pkg -ne $version -or $conf -ne $version -or $cargo -ne $version) {
            throw "Versões diferentes da tag $($env:TAG): package.json=$pkg, tauri.conf.json=$conf, Cargo.toml=$cargo."
          }

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      # Chaves: TAURI_SIGNING_PRIVATE_KEY é o conteúdo do arquivo da chave privada (secret do repositório).
      - name: Gerar o instalador assinado e a release (rascunho)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Orquestrador ${{ github.ref_name }}
          releaseBody: Instalador para Windows, por usuário. O app se atualiza sozinho ao abrir.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true

      # Num rascunho, o tauri-action grava no manifesto a URL da API do asset; o app deve baixar pela URL pública da tag.
      - name: Apontar o latest.json para a URL pública do instalador
        shell: pwsh
        run: |
          $version = $env:TAG.Substring(1)
          $dir = Join-Path $env:RUNNER_TEMP 'release-manifest'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          gh release download $env:TAG --dir $dir --pattern latest.json --clobber
          $path = Join-Path $dir 'latest.json'
          $raw = Get-Content $path -Raw
          $old = ($raw | ConvertFrom-Json).platforms.'windows-x86_64'.url
          if (-not $old) { throw 'latest.json sem a URL de windows-x86_64.' }
          $url = "https://github.com/luansilvadb/orquestrador/releases/download/$($env:TAG)/Orquestrador_${version}_x64-setup.exe"
          Set-Content -Path $path -Value $raw.Replace($old, $url) -NoNewline
          gh release upload $env:TAG $path --clobber

      # Antes de alguém publicar: o instalador, a assinatura e o manifesto precisam estar consistentes.
      - name: Conferir a release em rascunho
        shell: pwsh
        run: |
          $version = $env:TAG.Substring(1)
          $release = gh release view $env:TAG --json isDraft,assets | ConvertFrom-Json
          if (-not $release.isDraft) { throw "A release $($env:TAG) já não é rascunho; não será conferida assim." }
          $names = @($release.assets | ForEach-Object { $_.name })
          $installer = @($names | Where-Object { $_ -like "*_${version}_x64-setup.exe" })
          if ($installer.Count -ne 1) { throw "Instalador de $version não encontrado entre: $($names -join ', ')" }
          $exe = $installer[0]
          foreach ($needed in @($exe, "$exe.sig", 'latest.json')) {
            if ($names -notcontains $needed) { throw "Falta $needed na release $($env:TAG)." }
          }
          $dir = Join-Path $env:RUNNER_TEMP 'release-check'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          gh release download $env:TAG --dir $dir --pattern latest.json --pattern "$exe.sig" --clobber
          $manifest = Get-Content (Join-Path $dir 'latest.json') -Raw | ConvertFrom-Json
          $platform = $manifest.platforms.'windows-x86_64'
          $sig = (Get-Content (Join-Path $dir "$exe.sig") -Raw).Trim()
          if ($manifest.version -ne $version) { throw "latest.json anuncia $($manifest.version), não $version." }
          $url = "https://github.com/luansilvadb/orquestrador/releases/download/$($env:TAG)/$exe"
          if ($platform.url -ne $url) { throw "URL do instalador no latest.json: $($platform.url), esperado $url." }
          if ($platform.signature -ne $sig) { throw 'A assinatura do latest.json não é a do arquivo .sig enviado.' }
          # O comentário confiável da assinatura traz a versão assinada; o plugin recusa se não bater.
          $trusted = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($sig))
          if ($trusted -notmatch "version:$([regex]::Escape($version))(\t|\r|\n|$)") {
            throw "A assinatura não traz version:$version no comentário confiável."
          }
          Write-Host "Release $($env:TAG) conferida: $exe, $exe.sig e latest.json consistentes. Continua em rascunho até ser publicada."
