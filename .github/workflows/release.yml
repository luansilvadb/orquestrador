# Release de uma tag vX.Y.Z: gera o instalador NSIS (cargo-packager) assinado e o latest.json, confere tudo e só então publica como a última release estável.
# Ordem: tag, versões e notas -> checks -> instalador em rascunho -> notas e latest.json -> conferência -> publicação.
# Falha em qualquer passo deixa a release em rascunho (ou nem a cria). Rerun para uma tag já publicada para antes de alterar qualquer coisa.
name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      # O app, o assinador e o compat-tauri compilam no mesmo target.
      CARGO_TARGET_DIR: ${{ github.workspace }}\target
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      # Antes de qualquer build: tag, manifests, notas e ordem de versão. Native do PowerShell não para sozinho: cada código de saída é conferido.
      - name: Conferir a tag, as versões, as notas e a release existente
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw "A tag $($env:TAG) não é vX.Y.Z." }
          $version = $Matches[1]

          cargo xtask release check-versions $version
          if ($LASTEXITCODE -ne 0) { throw "As versões dos manifests não batem com $version." }

          # Release já publicada para a tag não é tocada. Rascunho de tentativa anterior pode ser refeito.
          $view = gh release view $env:TAG --repo $env:REPO --json isDraft 2>&1
          if ($LASTEXITCODE -eq 0) {
            if (-not ($view | ConvertFrom-Json).isDraft) {
              throw "A release $($env:TAG) já está publicada. Ela não é alterada por este job: crie uma versão nova."
            }
            Write-Host "Rascunho de $($env:TAG) de uma tentativa anterior: será refeito."
          } elseif ("$view" -notmatch 'not found') {
            throw "gh release view falhou (código $LASTEXITCODE): $view"
          }

          # A versão nova precisa ser maior que a última publicada; o app não instala versão menor.
          $latest = gh api "repos/$($env:REPO)/releases/latest" --jq .tag_name 2>&1
          $previous = ''
          if ($LASTEXITCODE -eq 0) {
            $previous = ([string]$latest).Trim().TrimStart('v')
            if (-not ([version]$version -gt [version]$previous)) {
              throw "$version não é maior que a última release publicada ($previous)."
            }
          } elseif ("$latest" -notmatch 'HTTP 404') {
            throw "gh api releases/latest falhou (código $LASTEXITCODE): $latest"
          }

          cargo xtask release check-notes $version $previous
          if ($LASTEXITCODE -ne 0) { throw "As notas de docs/releases/v$version.md não servem para publicar." }

      - name: Aguardar CI verde para o commit da tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sha -notmatch '^[0-9a-f]{40}$') { throw "Não foi possível obter o SHA do commit checkout: $sha" }
          cargo xtask release wait-ci $sha
          if ($LASTEXITCODE -ne 0) { throw "A CI de push em main não aprovou o commit $sha." }

      # FFmpeg estático do orquestrador-midia: o cache guarda os pacotes binários do vcpkg e o libclang.
      - name: Cache do FFmpeg estático e do libclang
        id: cache-ffmpeg
        uses: actions/cache/restore@v4
        with:
          path: |
            C:\vcpkg-cache
            ferramentas\libclang
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('crates/midia/preparar-ffmpeg.ps1') }}

      - name: Preparar o FFmpeg estático e o libclang
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-cache
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force C:\vcpkg-cache | Out-Null
          & pwsh crates/midia/preparar-ffmpeg.ps1

      # Salvo logo após a preparação, para não depender do sucesso dos testes.
      - name: Salvar o cache do FFmpeg estático e do libclang
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            C:\vcpkg-cache
            ferramentas\libclang
          key: ${{ steps.cache-ffmpeg.outputs.cache-primary-key }}

      # Testes Rust do workspace, inclusive os do fluxo de release (xtask) e do updater (orquestrador-app).
      - name: Rodar os checks
        shell: bash
        run: cargo test --workspace

      - name: Instalar o cargo-packager
        shell: bash
        run: cargo install cargo-packager --version 0.11.8 --locked

      # Instalador NSIS por usuário (cargo-packager), .sig com a versão assinada e latest.json com as notas completas (com o H1),
      # pela chave TAURI_SIGNING_PRIVATE_KEY (conteúdo da chave privada, secret do repositório; sem senha). Sobe tudo num rascunho.
      - name: Gerar o instalador assinado e a release em rascunho
        shell: pwsh
        env:
          ORQ_CHAVE_ASSINATURA: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = $env:TAG.Substring(1)
          $saida = Join-Path $env:RUNNER_TEMP 'pacote'
          & pwsh crates/app/empacotamento/empacotar.ps1 -Versao $version -Notas "docs/releases/v$version.md" -Saida $saida
          $exe = Join-Path $saida "Orquestrador_${version}_x64-setup.exe"
          $body = Join-Path $saida 'body.md'
          cargo xtask release release-body $version $body

          # Rascunho de tentativa anterior: troca os assets; senão, cria.
          $null = gh release view $env:TAG --repo $env:REPO --json isDraft 2>&1
          if ($LASTEXITCODE -eq 0) {
            & gh release edit $env:TAG --repo $env:REPO --notes-file $body --title "Orquestrador $($env:TAG)"
            & gh release upload $env:TAG $exe "$exe.sig" (Join-Path $saida 'latest.json') --repo $env:REPO --clobber
          } else {
            & gh release create $env:TAG $exe "$exe.sig" (Join-Path $saida 'latest.json') --repo $env:REPO --draft --title "Orquestrador $($env:TAG)" --notes-file $body --verify-tag
          }

      # Antes de publicar: rascunho, instalador (baixado e verificado com a chave pública do app), .sig, manifesto e corpo da release.
      # O instalador passa pelo assinador e pelo tauri-plugin-updater 2.14.1 do 0.1.48 (compat-tauri), que precisa aceitá-lo.
      # Asset ausente faz o download falhar; .exe vazio não passa na assinatura.
      - name: Conferir o rascunho antes de publicar
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = $env:TAG.Substring(1)
          $exe = "Orquestrador_${version}_x64-setup.exe"

          $json = & gh release view $env:TAG --repo $env:REPO --json isDraft,body
          $release = $json | ConvertFrom-Json
          if (-not $release.isDraft) { throw "A release $($env:TAG) já não é rascunho; não será publicada por este job." }

          $dir = Join-Path $env:RUNNER_TEMP 'release-check'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          & gh release download $env:TAG --repo $env:REPO --pattern latest.json --pattern "$exe.sig" --pattern $exe --dir $dir --clobber
          cargo xtask release verify-manifest $version (Join-Path $dir 'latest.json') (Join-Path $dir "$exe.sig") "docs/releases/v$version.md"

          # Assinatura Minisign do instalador baixado, com a chave pública embutida no app (a do updater do 0.1.48).
          $fonte = Get-Content -Raw crates/app/src/atualizacao/mod.rs
          if ($fonte -notmatch 'PUBKEY_OFICIAL: &str = "([A-Za-z0-9+/=]+)"') { throw 'PUBKEY_OFICIAL não encontrada.' }
          $pubkey = $Matches[1]
          cargo build --release --locked --manifest-path crates/app/empacotamento/assinador/Cargo.toml
          & target/release/orquestrador-assinador.exe verificar $pubkey $version (Join-Path $dir 'latest.json') (Join-Path $dir $exe)
          cargo build --release --locked --manifest-path crates/app/empacotamento/compat-tauri/Cargo.toml
          & target/release/orquestrador-compat-tauri.exe verificar $pubkey (Join-Path $dir 'latest.json') (Join-Path $dir $exe)

          # O corpo da release tem de ser o texto das notas sem o título (começa em ## Resumo; só CRLF/LF e espaço final podem diferir).
          $bodyFile = Join-Path $dir 'body.md'
          [System.IO.File]::WriteAllText($bodyFile, [string]$release.body)
          cargo xtask release verify-body $bodyFile "docs/releases/v$version.md"

      # Último passo: a release vira a latest estável, que é o endereço que os apps consultam. Só chega aqui se a conferência passou.
      - name: Publicar como a última release estável
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $sha = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sha -notmatch '^[0-9a-f]{40}$') { throw "Não foi possível obter o SHA do commit checkout: $sha" }
          cargo xtask release wait-ci $sha
          if ($LASTEXITCODE -ne 0) { throw "A CI de push em main não aprovou o commit $sha." }

          & gh release edit $env:TAG --repo $env:REPO --draft=false --latest
          $json = & gh release view $env:TAG --repo $env:REPO --json isDraft,isPrerelease
          $state = $json | ConvertFrom-Json
          if ($state.isDraft -or $state.isPrerelease) { throw "Estado inesperado depois de publicar: $json" }

          Write-Host "Release $($env:TAG) publicada como a última release estável."
