# Checks a cada push em main e a cada pull request: testes e clippy no Windows, em jobs paralelos, e compilação do backend
# (orquestrador-core) em Linux e macOS. Sem segredos, sem assinatura, sem publicação.
name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # Media Foundation do orquestrador-midia, opcional no Windows Server. Os formatos que exigem extensão da
      # Microsoft Store (Ogg, Opus, VP8) pulam nos testes.
      - name: Media Foundation
        shell: pwsh
        run: |
          if ((Get-WindowsFeature Server-Media-Foundation).InstallState -ne 'Installed') {
            $r = Install-WindowsFeature Server-Media-Foundation
            if (-not $r.Success) { throw "Server-Media-Foundation não instalou: $($r.ExitCode)" }
          }

      # Só main salva: o cache de main é lido por PRs, o de um PR só pelo próprio PR. Os crates locais (vendor/gpui-*) entram
      # no cache; o cargo recompila só o que mudou.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-workspace-crates: 'true'
          workspaces: |
            . -> target
            crates/app/empacotamento/assinador -> target

      - name: Testes Rust
        shell: bash
        run: |
          cargo test --workspace
          cargo build --locked --manifest-path crates/app/empacotamento/assinador/Cargo.toml

  clippy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-workspace-crates: 'true'

      - name: Clippy
        shell: bash
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Só compila o backend fora do Windows (macOS e Linux). A interface é só para Windows.
  compilar:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Compilação do backend fora do Windows
        shell: bash
        run: cargo check -p orquestrador-core --all-targets
