# Checks a cada push em main e a cada pull request: testes e clippy no Windows e compilação do backend (orquestrador-core) em Linux e macOS. Sem segredos, sem assinatura, sem publicação.
name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # FFmpeg compartilhado (LGPL) do orquestrador-midia: o cache guarda o zip baixado e o libclang.
      - name: Cache do FFmpeg e do libclang
        id: cache-ffmpeg
        uses: actions/cache/restore@v4
        with:
          path: |
            ferramentas\ffmpeg.zip
            ferramentas\libclang
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('crates/midia/preparar-ffmpeg.ps1') }}

      - name: Preparar o FFmpeg e o libclang
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          & pwsh crates/midia/preparar-ffmpeg.ps1

      # Salvo logo após a preparação, para não depender do sucesso dos testes.
      - name: Salvar o cache do FFmpeg e do libclang
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ferramentas\ffmpeg.zip
            ferramentas\libclang
          key: ${{ steps.cache-ffmpeg.outputs.cache-primary-key }}

      # Só main salva: o cache de main é lido por PRs, o de um PR só pelo próprio PR.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target
            crates/app/empacotamento/assinador -> target

      - name: Testes Rust
        shell: bash
        run: |
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          cargo build --locked --manifest-path crates/app/empacotamento/assinador/Cargo.toml

  # Só compila o backend fora do Windows (macOS e Linux). A interface é só para Windows.
  compilar:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Compilação do backend fora do Windows
        shell: bash
        run: cargo check -p orquestrador-core --all-targets
