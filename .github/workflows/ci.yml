# Checks a cada push em main e a cada pull request: build do frontend, checagens puras, testes Rust no Windows e compilação do backend em Linux e macOS. Sem segredos, sem assinatura, sem publicação.
# Os checks de interface (npm run check:ui) não rodam aqui: sobem o Vite e um Chromium local.
name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
        shell: bash

      # O build vem antes dos testes Rust: o tauri-build pode exigir o dist/ do front-end.
      - name: Build do front-end e checagens puras
        shell: bash
        run: |
          npm run build
          npm run check

      - uses: dtolnay/rust-toolchain@stable

      # FFmpeg estático do orquestrador-midia: o cache guarda os pacotes binários do vcpkg e o libclang.
      - name: Cache do FFmpeg estático e do libclang
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg-cache
            C:\ferramentas\libclang
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('crates/midia/preparar-ffmpeg.ps1') }}

      - name: Preparar o FFmpeg estático e o libclang
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-cache
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force C:\vcpkg-cache | Out-Null
          & pwsh crates/midia/preparar-ffmpeg.ps1 -Ferramentas C:\ferramentas
          foreach ($n in 'VCPKG_ROOT', 'VCPKGRS_TRIPLET', 'LIBCLANG_PATH') {
            "$n=$([Environment]::GetEnvironmentVariable($n, 'User'))" >> $env:GITHUB_ENV
          }

      - name: Testes Rust
        shell: bash
        run: |
          cargo test --workspace
          cargo build --locked --manifest-path crates/app/empacotamento/assinador/Cargo.toml

  # Só compila o backend fora do Windows (macOS e Linux). O app ainda não tem os recursos lá, então não há teste.
  compilar:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # Pacotes do Tauri 2 para Ubuntu, conforme a documentação de pré-requisitos (tauri.app/start/prerequisites).
      - name: Dependências do Tauri no Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci
        shell: bash

      - run: npm run build
        shell: bash

      - uses: dtolnay/rust-toolchain@stable

      - name: Compilação do backend fora do Windows
        shell: bash
        run: cargo check --workspace --all-targets
