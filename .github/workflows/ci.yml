# Checks a cada push em main e a cada pull request: build do frontend, checagens puras e testes Rust. Sem segredos, sem assinatura, sem publicação.
# Os checks de interface (npm run check:ui) não rodam aqui: sobem o Vite e um Chromium local.
name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
        shell: bash

      # O build vem antes dos testes Rust: o tauri-build pode exigir o dist/ do front-end.
      - name: Build do front-end e checagens puras
        shell: bash
        run: |
          npm run build
          npm run check

      - uses: dtolnay/rust-toolchain@stable

      - name: Testes Rust
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml
