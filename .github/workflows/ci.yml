# Checks a cada push em main e a cada pull request: testes e clippy no Windows e compilação do backend (orquestrador-core) em Linux e macOS. Sem segredos, sem assinatura, sem publicação.
name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # FFmpeg estático do orquestrador-midia: o cache guarda os pacotes binários do vcpkg e o libclang.
      - name: Cache do FFmpeg estático e do libclang
        id: cache-ffmpeg
        uses: actions/cache/restore@v4
        with:
          path: |
            C:\vcpkg-cache
            ferramentas\libclang
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('crates/midia/preparar-ffmpeg.ps1') }}

      - name: Preparar o FFmpeg estático e o libclang
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-cache
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force C:\vcpkg-cache | Out-Null
          & pwsh crates/midia/preparar-ffmpeg.ps1

      # Salvo logo após a preparação, para não depender do sucesso dos testes.
      - name: Salvar o cache do FFmpeg estático e do libclang
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            C:\vcpkg-cache
            ferramentas\libclang
          key: ${{ steps.cache-ffmpeg.outputs.cache-primary-key }}

      - name: Testes Rust
        shell: bash
        run: |
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          cargo build --locked --manifest-path crates/app/empacotamento/assinador/Cargo.toml

  # Só compila o backend fora do Windows (macOS e Linux). A interface é só para Windows.
  compilar:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Compilação do backend fora do Windows
        shell: bash
        run: cargo check -p orquestrador-core --all-targets
