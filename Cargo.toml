[workspace]
resolver = "2"
members = ["crates/core", "crates/ui", "crates/app", "crates/editor", "crates/pesquisa", "crates/arvore", "crates/git", "crates/midia", "crates/xtask", "crates/hunks"]

# Versão única do app: `agents/mcp.rs` anuncia a do pacote core.
[workspace.package]
version = "0.2.0"
edition = "2021"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# O build script do `ffmpeg-sys-next` roda o bindgen na thread principal (pilha de 1 MiB no Windows); em opt-level 0
# a recursão do bindgen sobre os cabeçalhos do FFmpeg estoura a pilha (STATUS_STACK_OVERFLOW). `RUST_MIN_STACK` não
# resolve: só vale para threads criadas por `std::thread`. Otimizado, os quadros encolhem e cabem.
[profile.dev.package.bindgen]
opt-level = 3

# No release os build scripts e suas dependências usam `build-override` (opt-level 0): mesmo estouro.
[profile.release.package.bindgen]
opt-level = 3

# Cópias alteradas de crates de terceiros (ver vendor/README.md). Dependência por caminho conta como local e ganharia
# a depuração do perfil, estourando o PDB do link no Windows (LNK1140).
[profile.dev.package.gpui-base]
debug = false

[profile.dev.package.gpui-pre-windows]
debug = false

[profile.dev.package.gpui-component]
debug = false

[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
gpui-component = { path = "vendor/gpui-component" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
