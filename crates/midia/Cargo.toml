[package]
name = "orquestrador-midia"
version.workspace = true
edition.workspace = true

[lib]
name = "orquestrador_midia"

[dependencies]
orquestrador-core = { path = "../core" }
orquestrador-ui = { path = "../ui" }
gpui-kit = "=0.9.1"
# Estático e só LGPL: ver README.md e preparar-ffmpeg.ps1.
ffmpeg-next = { version = "=9.1.0", default-features = false, features = ["codec", "format", "filter", "software-resampling", "software-scaling", "static"] }
cpal = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
smallvec = "1"
png = "0.18"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
gpui-kit = { version = "=0.9.1", features = ["test-support"] }
