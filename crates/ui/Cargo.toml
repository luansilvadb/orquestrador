[package]
name = "orquestrador-ui"
version.workspace = true
edition.workspace = true

[lib]
name = "orquestrador_ui"

[dependencies]
gpui-kit = "=0.9.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
icu_collator = "2"
icu_locale_core = "2"

[dev-dependencies]
gpui-kit = { version = "=0.9.1", features = ["test-support"] }
