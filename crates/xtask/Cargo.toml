[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]

serde_yaml = "0.9"
