[package]
name = "orquestrador-arvore"
version.workspace = true
edition.workspace = true

[lib]
name = "orquestrador_arvore"

[dependencies]
orquestrador-core = { path = "../core" }
orquestrador-ui = { path = "../ui" }
gpui-kit = "=0.9.1"

[dev-dependencies]
gpui-kit = { version = "=0.9.1", features = ["test-support"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory"] }

[[example]]
# Nome por crate: exemplos homônimos colidem no diretório de saída e o `cargo test` paralelo falha com LNK1104.
name = "vitrine-arvore"
path = "examples/vitrine.rs"
