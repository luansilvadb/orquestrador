[package]
name = "orquestrador-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "orquestrador-gpui"
path = "src/main.rs"

[dependencies]
orquestrador-core = { path = "../core" }
gpui-kit = "=0.9.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
alacritty_terminal = "0.26"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading", "Win32_Security", "Win32_System_IO"] }

[dev-dependencies]
gpui-kit = { version = "=0.9.1", features = ["test-support"] }
