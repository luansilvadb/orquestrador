[package]
name = "orquestrador-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "orquestrador"
path = "src/main.rs"

[dependencies]
orquestrador-core = { path = "../core" }
orquestrador-ui = { path = "../ui" }
orquestrador-arvore = { path = "../arvore" }
orquestrador-editor = { path = "../editor" }
orquestrador-git = { path = "../git" }
orquestrador-midia = { path = "../midia" }
orquestrador-pesquisa = { path = "../pesquisa" }
gpui-kit = "=0.9.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
alacritty_terminal = "0.26"
rusty-leveldb = "4.0.2"
# Atualização (atualizacao/): o mesmo verificador do tauri-plugin-updater.
ureq = "3"
minisign-verify = "0.3"
semver = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading", "Win32_Security", "Win32_System_IO", "Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
gpui-kit = { version = "=0.9.1", features = ["test-support"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"
