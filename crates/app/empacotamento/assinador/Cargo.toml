[package]
name = "orquestrador-assinador"
version = "0.1.0"
edition = "2021"
publish = false

# Ferramenta de release, fora do workspace do app.
[workspace]

[dependencies]
# =0.7.3: a 0.7.4 não decifra chaves de senha vazia (assina com key id errado) e a 0.7.5+ as recusa ("Wrong password"); as do Tauri CLI são assim.
minisign = "=0.7.3"
minisign-verify = "0.3"
base64 = "0.22"
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
