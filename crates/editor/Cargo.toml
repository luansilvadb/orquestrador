[package]
name = "orquestrador-editor"
version.workspace = true
edition.workspace = true

[lib]
name = "orquestrador_editor"

[dependencies]
orquestrador-core = { path = "../core" }
orquestrador-ui = { path = "../ui" }
gpui-kit = "=0.9.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "regex-onig", "dump-load", "yaml-load"] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-onig"] }
dprint-plugin-typescript = "*"
dprint-plugin-json = "*"
dprint-plugin-markdown = "*"
malva = { version = "*", features = ["config_serde"] }
markup_fmt = { version = "*", features = ["config_serde"] }
pretty_yaml = { version = "*", features = ["config_serde"] }
serde_yaml = "0.9"
json5 = "0.4"
anyhow = "1"

[dev-dependencies]
# Para montar `assets/sintaxes.packdump` (teste ignorado `gerar_sintaxes`).
syntect = { version = "5.3", default-features = false, features = ["yaml-load", "dump-create"] }
markdown = "1"
gpui-kit = { version = "=0.9.1", features = ["test-support"] }

[lints.rust]
# O Oniguruma do `syntect` exporta os símbolos no MSVC (`ONIG_EXTERN` vira `dllexport`), e o link avisa que criou a
# `.lib`/`.exp` dos executáveis. Some de vez com `CFLAGS=/DONIG_STATIC` no build do `onig_sys`.
linker_messages = "allow"
