[package]
name = "orquestrador-git"
version.workspace = true
edition.workspace = true

[lib]
name = "orquestrador_git"

[dependencies]
orquestrador-core = { path = "../core" }
orquestrador-ui = { path = "../ui" }
gpui-kit = "=0.9.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2.7"
async-channel = "2"
futures-lite = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy", "dump-load"] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }

[dev-dependencies]
gpui-kit = { version = "=0.9.1", features = ["test-support"] }
