[package]
name = "orquestrador-core"
version.workspace = true
edition.workspace = true

[lib]
name = "orquestrador_core"

[dependencies]
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
regex = "1"
ignore = "0.4.33"
# Respostas HTTP de mídia com Range (`ide::files::serve_stream`).
http = "1"

# As chamadas ao Windows ficam em `src/platform/windows.rs`; fora do Windows, esta dependência nem entra.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }
