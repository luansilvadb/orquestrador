<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orquestrador</title>
<link rel="icon" href="data:,">
<style>
  /* Visual inspirado no Linear: superficies quase pretas, bordas finas, tipografia compacta, um unico acento indigo. */
  :root {
    color-scheme: dark light;
    --bg: #08090a; --panel: #0f1011; --field: #141516; --text: #f7f8f8; --muted: #8a8f98;
    --line: #23252a; --line-strong: #34363c; --accent: #5e6ad2; --accent-hover: #6e79e0; --on-accent: #ffffff;
    --glow: rgba(94, 106, 210, 0.22); --error: #ff8a80; --error-bg: rgba(235, 87, 87, 0.1); --error-line: rgba(235, 87, 87, 0.3);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #fbfbfc; --panel: #ffffff; --field: #ffffff; --text: #16171a; --muted: #6b6f76;
      --line: #e6e6ea; --line-strong: #d0d1d6; --accent: #5e6ad2; --accent-hover: #4f5bc4; --on-accent: #ffffff;
      --glow: rgba(94, 106, 210, 0.12); --error: #c4302b; --error-bg: #fdf0ef; --error-line: #f3c9c6;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100vh; padding: 72px 16px 48px; color: var(--text);
    background: radial-gradient(ellipse 80% 420px at 50% -120px, var(--glow), transparent), var(--bg);
    font: 14px/1.5 Inter, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; font-feature-settings: "cv01", "ss03";
  }
  main { max-width: 720px; margin: 0 auto; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px; margin: 0 0 16px; padding: 3px 10px 3px 8px;
    font-size: 12px; font-weight: 500; color: var(--muted); border: 1px solid var(--line); border-radius: 999px;
  }
  .eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  h1 { margin: 0 0 8px; font-size: 28px; line-height: 1.15; font-weight: 600; letter-spacing: -0.022em; }
  .project { margin: 0 0 32px; color: var(--muted); }
  code {
    padding: 2px 6px; font: 12px "Cascadia Code", Consolas, ui-monospace, monospace; color: var(--text);
    background: var(--field); border: 1px solid var(--line); border-radius: 5px; overflow-wrap: anywhere;
  }
  .roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  fieldset {
    margin: 0; padding: 20px; min-width: 0; display: grid; gap: 14px; align-content: start;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    transition: border-color 0.15s;
  }
  fieldset:focus-within { border-color: var(--line-strong); }
  legend { padding: 0; float: left; width: 100%; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .hint { margin: -10px 0 4px; color: var(--muted); font-size: 13px; }
  label { display: grid; gap: 6px; font-size: 12px; font-weight: 500; color: var(--muted); }
  select, input {
    width: 100%; height: 34px; padding: 0 10px; font: inherit; font-size: 13px; color: var(--text);
    background: var(--field); border: 1px solid var(--line); border-radius: 7px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  select:hover, input:hover { border-color: var(--line-strong); }
  select:focus-visible, input:focus-visible { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
  #errors {
    margin: 12px 0 0; padding: 10px 14px 10px 30px; font-size: 13px; color: var(--error);
    background: var(--error-bg); border: 1px solid var(--error-line); border-radius: 8px;
  }
  .actions { margin-top: 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  button {
    height: 34px; padding: 0 16px; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
    color: var(--on-accent); background: var(--accent); border: 0; border-radius: 7px;
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.12) inset, 0 4px 14px var(--glow);
    transition: background 0.15s;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: 0.5; cursor: default; }
  .note { flex: 1; min-width: 220px; color: var(--muted); font-size: 12px; }
  #done { padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Nova sessão</p>
  <h1>Orquestrador</h1>
  <p class="project">Projeto: <code id="project"></code></p>
  <form id="form">
    <div class="roles" id="roles"></div>
    <ul id="errors" role="alert" hidden></ul>
    <div class="actions">
      <button type="submit">Salvar e iniciar</button>
      <span class="note">As escolhas viram o padrão da próxima inicialização. A orquestração começa no terminal.</span>
    </div>
  </form>
  <p id="done" hidden>Configuração salva. A orquestração começou no terminal; esta aba pode ser fechada.</p>
</main>
<script id="data" type="application/json">{{DATA}}</script>
<script>
  const data = JSON.parse(document.getElementById('data').textContent);
  const state = JSON.parse(JSON.stringify(data.config));
  const CLI_DEFAULT = '(padrão do CLI)', OTHER = '\u0000outro';
  const roles = [
    ['orchestrator', 'Orquestrador', 'Só lê o projeto e delega.'],
    ['executor', 'Executor', 'Recebe uma tarefa por vez e opera o repositório.'],
  ];
  const form = document.getElementById('form'), errors = document.getElementById('errors');
  const button = form.querySelector('button');
  document.getElementById('project').textContent = data.project;

  const toolOf = name => data.tools.find(t => t.name === name);
  const fill = (select, values, current) =>
    select.replaceChildren(...values.map(v => new Option(v || CLI_DEFAULT, v, false, v === current)));

  for (const [role, title, hint] of roles) {
    const r = state[role];
    const box = document.createElement('fieldset');
    box.innerHTML = `<legend>${title}</legend><p class="hint">${hint}</p>
      <label>Ferramenta<select name="tool"></select></label>
      <label>Modelo<select name="model"></select></label>
      <label hidden>Nome do modelo<input name="custom" autocomplete="off" spellcheck="false"></label>
      <label>Esforço<select name="effort"></select></label>`;
    const [toolSel, modelSel, effortSel] = box.querySelectorAll('select');
    const custom = box.querySelector('input');

    // Só os esforços que o modelo escolhido aceita; um modelo fora da lista recebe todos os da ferramenta.
    const showEfforts = () => {
      const tool = toolOf(r.tool);
      const known = (tool.models.find(m => m.name === r.model) || {}).efforts;
      const list = tool.efforts.filter(e => !known || known.includes(e));
      if (!list.includes(r.effort)) r.effort = '';
      fill(effortSel, ['', ...list], r.effort);
    };
    const showCustom = on => { custom.parentElement.hidden = !on; custom.required = on; };
    const showModels = () => {
      const names = toolOf(r.tool).models.map(m => m.name);
      const typed = r.model !== '' && !names.includes(r.model);
      fill(modelSel, ['', ...names], r.model);
      modelSel.add(new Option('Outro…', OTHER, false, typed));
      custom.value = typed ? r.model : '';
      showCustom(typed);
      showEfforts();
    };

    fill(toolSel, data.tools.filter(t => t.roles.includes(role)).map(t => t.name), r.tool);
    // Outra ferramenta limpa modelo e esforço: os valores de uma não servem para a outra.
    toolSel.onchange = () => { r.tool = toolSel.value; r.model = ''; r.effort = ''; showModels(); };
    modelSel.onchange = () => {
      const other = modelSel.value === OTHER;
      showCustom(other);
      r.model = other ? custom.value.trim() : modelSel.value;
      if (other) custom.focus();
      showEfforts();
    };
    custom.oninput = () => { r.model = custom.value.trim(); showEfforts(); };
    effortSel.onchange = () => { r.effort = effortSel.value; };
    showModels();
    document.getElementById('roles').append(box);
  }

  const showErrors = list => {
    errors.replaceChildren(...list.map(text => Object.assign(document.createElement('li'), { textContent: text })));
    errors.hidden = false;
  };
  form.onsubmit = async event => {
    event.preventDefault();
    button.disabled = true;
    errors.hidden = true;
    try {
      const response = await fetch(location.href, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(state) });
      const answer = await response.json();
      if (response.ok) { form.hidden = true; document.getElementById('done').hidden = false; return; }
      showErrors(answer.errors);
    } catch {
      showErrors(['Sem resposta do terminal. O strategist ainda está em execução?']);
    }
    button.disabled = false;
  };
</script>
</body>
</html>
